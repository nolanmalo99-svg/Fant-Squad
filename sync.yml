name: Sync ESPN data

on:
  schedule:
    # NFL Sunday window (~1pm ET kickoff through the end of SNF, covering both EDT/EST): every 15 min.
    # 16:00-23:59 UTC Sunday covers the daytime/early-evening slate.
    - cron: "*/15 16-23 * 9-12,1 0"
    # 00:00-05:59 UTC Monday covers SNF running past midnight (still "Sunday night" in the US).
    - cron: "*/15 0-5 * 9-12,1 1"
    # Monday Night Football: kicks off ~8:15pm ET -> 23:00-23:59 UTC Monday, running into Tuesday.
    - cron: "*/15 23 * 9-12,1 1"
    - cron: "*/15 0-5 * 9-12,1 2"
    # Thursday Night Football: same kickoff window -> 23:00-23:59 UTC Thursday, running into Friday.
    - cron: "*/15 23 * 9-12,1 4"
    - cron: "*/15 0-5 * 9-12,1 5"
    # Every other day/time in season: every 4 hours is plenty.
    - cron: "0 */4 * 9-12,1 1-6"
  workflow_dispatch:
    inputs:
      season:
        description: "season year (blank = auto-detect)"
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from ESPN and rebuild data files
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          cd tools
          python3 build_data.py ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '' }}

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain js/site-data.js js/matchups-data.js tools/data)" ]; then
            git config user.name  "fant-squad-league-bot"
            git config user.email "actions@users.noreply.github.com"
            git add js/site-data.js js/matchups-data.js tools/data
            git commit -m "sync: refresh ESPN data $(date -u +%Y-%m-%dT%H:%M)"
            git push
          else
            echo "no changes"
          fi
